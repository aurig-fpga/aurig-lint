name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # aurig-lint itself.
      - name: Checkout aurig-lint
        uses: actions/checkout@v6
        with:
          path: aurig-lint

      # The cross-repo dependency: aurig-lint does NOT bundle the parser/util
      # core -- it requires aurig::core off ::auto_path. We check the PUBLIC
      # aurig-fpga/aurig-core repo out into a sibling dir and point TCLLIBPATH
      # at it. No token needed: the repo is public, so the default GITHUB_TOKEN
      # suffices.
      - name: Checkout aurig-core (dependency)
        uses: actions/checkout@v6
        with:
          repository: aurig-fpga/aurig-core
          path: aurig-core

      - name: Install Tcl 8.6 + tcllib
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl tcllib
          tclsh <<'EOF'
          puts "tcl patchlevel: [info patchlevel]"
          EOF

      - name: Run cross-repo dependency proof + ported lint tests
        working-directory: aurig-lint
        env:
          # TCLLIBPATH is a Tcl list of dirs prepended to ::auto_path; point it
          # at the aurig-core checkout so `package require aurig::core`
          # resolves (and is pulled transitively by aurig::lint).
          TCLLIBPATH: ${{ github.workspace }}/aurig-core
        run: |
          set -e
          fail=0
          tests=(
            test/test_lint_dependency.tcl
            test/test_lint_cli_fail_on_severity.tcl
            test/test_lint_cli_json_escape.tcl
            test/test_lint_cli_report_formats.tcl
            test/test_lint_cli_source_rc2.tcl
            test/test_lint_cli_source_safety.tcl
            test/test_lint_enum_literal_naming.tcl
            test/test_lint_label_naming.tcl
            test/test_lint_instantiation_comments.tcl
            test/test_lint_library_case.tcl
            test/test_lint_policy_overrides.tcl
            test/test_lint_policy_validation.tcl
            test/test_lint_policy_rule_id.tcl
            test/test_lint_policy_naming_scope.tcl
            test/test_lint_pragma_suppression.tcl
            test/test_lint_pragma_case.tcl
            test/test_lint_process_diagnostic_lines.tcl
            test/test_lint_require_process_label.tcl
            test/test_lint_reset_message.tcl
            test/test_run_lint_project_baseline.tcl
            test/test_run_lint_project_excludes.tcl
            test/test_run_lint_project_fail_on_and_manifest.tcl
            test/test_run_lint_project_md_skipped_escape.tcl
            test/test_run_lint_project_md_report.tcl
            test/test_run_lint_project_policy_once.tcl
            test/test_lint_project_required_packages.tcl
            test/test_generate_rules_reference.tcl
            test/test_doc_references_exist.tcl
            test/test_tcl_minimum_version.tcl
            test/test_report_encoding.tcl
            test/test_html_reports_offline.tcl
            test/test_html_report_file_names.tcl
            test/smoke/test_run_lint_single_file.tcl
          )
          for t in "${tests[@]}"; do
            echo "==================== $t ===================="
            if tclsh "$t"; then
              echo "RESULT: PASS  $t"
            else
              echo "RESULT: FAIL  $t (exit $?)"
              fail=1
            fi
          done
          exit $fail

  # TEMPORARY probe: compare Tcl install methods on windows-latest.
  windows-probe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        method: [choco, msi, msys2, gittcl-tarball, msys2tcl-tarball]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          path: aurig-lint
      - uses: actions/checkout@v6
        with:
          repository: aurig-fpga/aurig-core
          path: aurig-core
      - name: Install (choco)
        if: matrix.method == 'choco'
        run: |
          choco install magicsplat-tcl-tk --version 1.16.0 -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $t = Get-ChildItem 'C:\Program Files\Tcl\bin' -Filter 'tclsh*.exe' | Select-Object -First 1
          Get-ChildItem 'C:\Program Files\Tcl\bin' -Filter '*.exe' | ForEach-Object Name
          "TCLSH=$($t.FullName)" >> $env:GITHUB_ENV
      - name: Install (msi)
        if: matrix.method == 'msi'
        run: |
          $msi = "$env:RUNNER_TEMP\tcl.msi"
          curl.exe -sSfL --retry 3 -o $msi https://sourceforge.net/projects/magicsplat/files/magicsplat-tcl/tcl-8.6.16-installer-1.16.0-x64.msi/download
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $h = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($h -ne '754A5FC471FDAE655DD0CEC1FD5613B2302512ADADCDE28E17B516B0F5AED17A') { "checksum mismatch: $h"; exit 1 }
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i `"$msi`" ALLUSERS=1 APPLICATIONFOLDER=C:\Tcl /qn /norestart /l*v `"$env:RUNNER_TEMP\msi.log`""
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi.log" -Tail 50; exit 1 }
          Get-ChildItem 'C:\Tcl\bin' -Filter '*.exe' | ForEach-Object Name
          "TCLSH=C:\Tcl\bin\tclsh.exe" >> $env:GITHUB_ENV
      - name: Install (msys2)
        if: matrix.method == 'msys2'
        run: |
          C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-tcl mingw-w64-ucrt-x86_64-tcllib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem 'C:\msys64\ucrt64\bin' -Filter 'tclsh*.exe' | ForEach-Object Name
          $t = Get-ChildItem 'C:\msys64\ucrt64\bin' -Filter 'tclsh*.exe' | Select-Object -First 1
          "TCLSH=$($t.FullName)" >> $env:GITHUB_ENV
      - name: Install (gittcl-tarball / msys2tcl-tarball)
        if: endsWith(matrix.method, '-tarball')
        run: |
          Get-Command tclsh -All -ErrorAction SilentlyContinue | ForEach-Object Source
          Get-ChildItem 'C:\Program Files\Git' -Recurse -Filter 'tclsh*.exe' -ErrorAction SilentlyContinue | ForEach-Object FullName
          if ('${{ matrix.method }}' -eq 'msys2tcl-tarball') {
            C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-tcl
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $tclsh = 'C:\msys64\ucrt64\bin\tclsh.exe'
          } else {
            $t = Get-ChildItem 'C:\Program Files\Git' -Recurse -Filter 'tclsh*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $t) { 'no tclsh in Git for Windows'; exit 1 }
            $tclsh = $t.FullName
          }          $tgz = "$env:RUNNER_TEMP\tcllib.tar.gz"
          curl.exe -sSfL --retry 3 -o $tgz https://core.tcl-lang.org/tcllib/uv/tcllib-2.0.tar.gz
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $h = (Get-FileHash $tgz -Algorithm SHA256).Hash
          if ($h -ne '590263DE0832AC801255501D003441A85FB180B8BA96265D50C4A9F92FDE2534') { "checksum mismatch: $h"; exit 1 }
          tar -xzf $tgz -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $tclsh "$env:RUNNER_TEMP\tcllib-2.0\installer.tcl" -no-wait -no-gui -no-html -no-nroff -no-examples -no-apps
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "TCLSH=$tclsh" >> $env:GITHUB_ENV
      - name: Probe
        working-directory: aurig-lint
        run: |
          "TCLSH=$env:TCLSH"
          & $env:TCLSH tools/check_tcl.tcl
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Tests
        working-directory: aurig-lint
        run: |
          $env:TCLLIBPATH = "$env:GITHUB_WORKSPACE/aurig-core" -replace '\\', '/'
          $tests = Select-String -Path .github/workflows/ci.yml -Pattern '^\s+(test/\S+\.tcl)$' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          "$($tests.Count) tests"
          foreach ($t in $tests) {
            "==================== $t ===================="
            & $env:TCLSH $t
            if ($LASTEXITCODE -ne 0) { "RESULT: FAIL  $t (exit $LASTEXITCODE)"; exit 1 }
            "RESULT: PASS  $t"
          }

  # Hygiene + secrets scan. This is the authoritative gitleaks run: local
  # hook installs may fail to build it on restricted networks, CI always
  # builds and runs it. Commit-msg-stage hooks are not exercised by
  # `run --all-files`; the no-ai-attribution job below covers that side.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1

  # Enforce the no-AI-attribution policy over the PR's commit range. The
  # local commit-msg hook is bypassable best-effort; this check is the
  # real barrier.
  no-ai-attribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check PR commit messages for AI attribution
        # KEEP IN SYNC (verbatim) with the no-ai-attribution pygrep hook in
        # .pre-commit-config.yaml -- same pattern, same escaping (grep -P
        # understands the inline (?i) flag).
        run: |
          git log "origin/${{ github.base_ref }}..HEAD" --format=%B > /tmp/pr-commit-msgs.txt
          grep -P '(?i)(co-authored-by:.*(claude|copilot|codex|anthropic|openai|chatgpt)|assisted-by:.*(claude|copilot|codex|anthropic|openai|chatgpt)|generated.with.*(claude|copilot|codex|anthropic|openai|chatgpt)|noreply@anthropic\.com|🤖.*generated)' /tmp/pr-commit-msgs.txt && status=0 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "ERROR: AI attribution detected in PR commit messages (matches above)."
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "ERROR: grep failed (exit $status) -- check did not run."
            exit "$status"
          fi
          echo "OK: no AI attribution in commit range."
